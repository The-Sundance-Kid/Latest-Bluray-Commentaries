- name: Run the Scraper Application
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scraper.py

      - name: Commit and Push Updated Database
        run: |
          if [ -f commentary_releases.csv ]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action Bot"
            git add commentary_releases.csv
            git diff-index --quiet HEAD || git commit -m "Automated database update: New commentary tracks added"
            git push
          else
            echo "No new updates to save today. Going back to sleep."
          fi
